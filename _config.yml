# GitHub Pages / Jekyll configuration
title: "Hangzhou He (何航舟)"
name: "Hangzhou He"
description: "Ph.D. student at Peking University working on interpretable machine learning, medical image analysis, and visual generation."
locale: en
url: "https://hangzhouhe.com"
baseurl: ""
repository: "riverback/riverback.github.io"
timezone: Asia/Shanghai

author:
  name: "Hangzhou He"
  chinese_name: "何航舟"
  avatar: "/images/profile.jpg"
  bio: "Ph.D. student"
  employer: "Peking University"
  location: "Beijing, China"
  email: "zhuang@stu.pku.edu.cn"
  googlescholar: "https://scholar.google.com/citations?hl=en&authuser=1&user=IVvW2kMAAAAJ"
  github: "riverback"
  twitter: "hangzhou_he"

include:
  - _pages
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor
  - node_modules
  - tmp
encoding: utf-8
markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
  hard_wrap: false
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
