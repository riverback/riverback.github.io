<aside class="author-profile" aria-label="About Hangzhou He">
  <img class="author-photo" src="{{ site.author.avatar | relative_url }}" alt="Hangzhou He" width="160" height="160">
  <div class="author-details">
    <p class="author-name">{{ site.author.name | escape }} <span lang="zh">{{ site.author.chinese_name | escape }}</span></p>
    <p class="author-bio">{{ site.author.bio | escape }}<br>{{ site.author.employer | escape }}</p>
    <p class="author-location">{{ site.author.location | escape }}</p>
    <ul class="author-links" aria-label="Contact and profiles">
      <li><a href="mailto:{{ site.author.email }}">Email</a></li>
      <li><a href="{{ site.author.googlescholar | escape }}">Google Scholar</a></li>
      <li><a href="https://github.com/{{ site.author.github }}">GitHub</a></li>
      <li><a href="https://twitter.com/{{ site.author.twitter }}">X / Twitter</a></li>
    </ul>
  </div>
</aside>
