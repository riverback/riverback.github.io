{% assign page_title = site.title %}
{% if page.title and page.title != '' %}{% assign page_title = page.title | append: ' · ' | append: site.title %}{% endif %}
{% assign description = page.description | default: site.description %}
<title>{{ page_title | escape }}</title>
<meta name="description" content="{{ description | escape }}">
<meta name="author" content="{{ site.author.name | escape }}">
<link rel="canonical" href="{{ page.url | replace: 'index.html', '' | absolute_url }}">
<meta property="og:type" content="website">
<meta property="og:locale" content="en_US">
<meta property="og:site_name" content="{{ site.title | escape }}">
<meta property="og:title" content="{{ page_title | escape }}">
<meta property="og:description" content="{{ description | escape }}">
<meta property="og:url" content="{{ page.url | replace: 'index.html', '' | absolute_url }}">
<meta property="og:image" content="{{ site.author.avatar | absolute_url }}">
<meta name="twitter:card" content="summary">
<meta name="twitter:creator" content="@{{ site.author.twitter | escape }}">
<meta name="twitter:title" content="{{ page_title | escape }}">
<meta name="twitter:description" content="{{ description | escape }}">
<meta name="twitter:image" content="{{ site.author.avatar | absolute_url }}">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": {{ site.author.name | jsonify }},
  "alternateName": {{ site.author.chinese_name | jsonify }},
  "url": {{ '/' | absolute_url | jsonify }},
  "image": {{ site.author.avatar | absolute_url | jsonify }},
  "affiliation": {"@type": "Organization", "name": {{ site.author.employer | jsonify }}},
  "sameAs": [{{ site.author.googlescholar | jsonify }}, {{ site.author.github | prepend: 'https://github.com/' | jsonify }}]
}
</script>
